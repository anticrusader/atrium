<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atrium — a living 3D office for your agents</title>
    <!-- The mark: an isometric floor plate under a column of light (an atrium
         is a light well) with three status-colored agents. See public/favicon.svg -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The Three.js canvas mounts here -->
    <div id="stage"></div>

    <!-- HUD overlay (built imperatively in src/ui/hud.js) -->
    <div id="hud" class="hud"></div>

    <!-- Loading veil -->
    <div id="boot" class="boot">
      <div class="boot__mark">ATRIUM</div>
      <div class="boot__bar"><div class="boot__fill"></div></div>
      <div class="boot__msg">opening the doors…</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
